name: Daily Consecutive Up Scan

on:
  # Scheduled: Weekdays at 17:00 Beijing time (09:00 UTC)
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '30 9 * * 1-5'

  # Manual trigger
  workflow_dispatch:
    inputs:
      continuous_days:
        description: 'Consecutive up days requirement'
        required: false
        default: '5'
      market:
        description: 'Market scope'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sh
          - sz
      exclude_st:
        description: 'Exclude ST stocks'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      exclude_kc_cy:
        description: 'Exclude STAR/ChiNext'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      delay:
        description: 'Request delay in seconds (smaller=faster, larger=safer)'
        required: false
        default: '0.3'

concurrency:
  group: up-scan
  cancel-in-progress: true

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directory
        run: mkdir -p output

      - name: Run scan
        env:
          CONTINUOUS_UP_DAYS: ${{ github.event.inputs.continuous_days || vars.CONTINUOUS_UP_DAYS || '5' }}
          SCAN_MARKET:        ${{ github.event.inputs.market || vars.SCAN_MARKET || 'all' }}
          EXCLUDE_ST:         ${{ github.event.inputs.exclude_st || vars.EXCLUDE_ST || 'true' }}
          EXCLUDE_KC_CY:      ${{ github.event.inputs.exclude_kc_cy || vars.EXCLUDE_KC_CY || 'false' }}
          REQUEST_DELAY:      ${{ github.event.inputs.delay || vars.REQUEST_DELAY || '0.3' }}
          OUTPUT_DIR:         ./output
        run: |
          DAYS="$CONTINUOUS_UP_DAYS"
          MARKET="$SCAN_MARKET"
          ARGS="--days $DAYS --market $MARKET"
          if [ "$EXCLUDE_ST" = "false" ]; then
            ARGS="$ARGS --no-exclude-st"
          fi
          if [ "$EXCLUDE_KC_CY" = "true" ]; then
            ARGS="$ARGS --no-exclude-kc-cy"
          fi
          echo ">>> Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: continuous-up-scan-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Show summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "Scan Summary"
          echo "=========================================="
          echo "- Days required: $CONTINUOUS_UP_DAYS"
          echo "- Market: $SCAN_MARKET"
          echo "- Exclude ST: $EXCLUDE_ST"
          echo "- Exclude STAR/ChiNext: $EXCLUDE_KC_CY"
          echo ""
          latest_json=$(ls -t output/continuous_up_*.json 2>/dev/null | head -1)
          if [ -n "$latest_json" ]; then
            count=$(python -c "import json; print(len(json.load(open('$latest_json'))))" 2>/dev/null || echo "?")
            echo "Found: $count stocks"
            echo ""
            echo "Output files:"
            ls -la output/
          else
            echo "No result file generated"
            ls -la output/ 2>/dev/null || echo "(output directory is empty)"
          fi
          echo "=========================================="

      - name: Send notification (optional)
        if: success() && !cancelled()
        run: |
          has_webhook=false
          [ -n "${WECHAT_WEBHOOK_URL}" ] && has_webhook=true
          [ -n "${TELEGRAM_BOT_TOKEN}" ] && has_webhook=true
          [ -n "${DISCORD_WEBHOOK_URL}" ] && has_webhook=true
          [ -n "${PUSHPLUS_TOKEN}" ]     && has_webhook=true

          if [ "$has_webhook" = false ]; then
            echo "No notification channels configured, skipping"
            exit 0
          fi

          latest_json=$(ls -t output/continuous_up_*.json 2>/dev/null | head -1)
          if [ -z "$latest_json" ] || [ ! -f "$latest_json" ]; then
            echo "No result file, skipping notification"
            exit 0
          fi

          count=$(python -c "import json; print(len(json.load(open('$latest_json'))))" 2>/dev/null || echo "0")
          today=$(date +%Y-%m-%d)
          summary=$(python scripts/summary.py "$latest_json" "$CONTINUOUS_UP_DAYS" "$SCAN_MARKET")

          if [ -n "${WECHAT_WEBHOOK_URL}" ]; then
            curl -s -X POST "${WECHAT_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":{\"text\":{\"content\":\"${summary}\"}}}" \
              && echo "WeChat notification sent" || echo "WeChat notification failed"
          fi

          if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${summary}" \
              && echo "Telegram notification sent" || echo "Telegram notification failed"
          fi

          if [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            curl -s -X POST "${DISCORD_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"${summary}\"}" \
              && echo "Discord notification sent" || echo "Discord notification failed"
          fi

          if [ -n "${PUSHPLUS_TOKEN}" ]; then
            curl -s -X POST "https://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"${PUSHPLUS_TOKEN}\",\"title\":\"Consecutive Up Scan ${today}\",\"content\":\"${summary}\"}" \
              && echo "PushPlus notification sent" || echo "PushPlus notification failed"
          fi
